name: oidc-debug
on: workflow_dispatch
permissions: { id-token: write, contents: read }
jobs:
  claims:
    runs-on: ubuntu-latest
    environment: { name: production }
    steps:
      - name: Print the OIDC claims (not the token)
        run: |
          set -euo pipefail
          TOK=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          python3 - "$TOK" <<'PY'
          import sys, json, base64
          p = sys.argv[1].split('.')[1]
          p += '=' * (-len(p) % 4)
          c = json.loads(base64.urlsafe_b64decode(p))
          for k in ('iss','aud','sub','repository','repository_owner','ref','environment','job_workflow_ref'):
              print('%-18s %s' % (k, c.get(k, '<absent>')))
          PY
